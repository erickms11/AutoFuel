<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ED8E8"/>
      <stop offset="100%" stop-color="#00A7BA"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB95B"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Speedometer / Arc ring -->
  <path d="M 120 330 A 150 150 0 1 1 392 330" fill="none" stroke="#1E293B" stroke-width="26" stroke-linecap="round"/>
  <path d="M 120 330 A 150 150 0 1 1 340 180" fill="none" stroke="url(#tealGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Fuel Pump Body -->
  <g transform="translate(186, 175)">
    <!-- Base pump -->
    <rect x="25" y="30" width="90" height="135" rx="16" fill="url(#tealGrad)"/>
    <!-- Pump screen -->
    <rect x="37" y="46" width="66" height="42" rx="8" fill="#0A0F1D"/>
    <!-- Fuel drop in screen -->
    <path d="M 70 56 C 70 56, 57 72, 57 78 C 57 85.2, 62.8 91, 70 91 C 77.2 91, 83 85.2, 83 78 C 83 72, 70 56, 70 56 Z" fill="url(#amberGrad)"/>
    <!-- Base stand -->
    <rect x="15" y="160" width="110" height="16" rx="6" fill="#4ED8E8"/>
    <!-- Fuel Hose -->
    <path d="M 115 70 C 145 70, 150 100, 150 120 L 150 135 C 150 145, 142 148, 140 140 L 140 110 C 140 95, 130 85, 115 85" fill="none" stroke="url(#amberGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Nozzle -->
    <path d="M 148 105 L 148 75 L 138 65 L 126 65" fill="none" stroke="url(#amberGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Accent glow tick marks -->
  <circle cx="120" cy="330" r="10" fill="#4ED8E8"/>
  <circle cx="256" cy="106" r="12" fill="#4ED8E8" filter="url(#glow)"/>
  <circle cx="392" cy="330" r="10" fill="#F59E0B"/>
</svg>
